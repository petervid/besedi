<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a heavenly reading room after the Pentagram painting. Pale sky ground, dawn-rose and gold light, a sky panel with the five-virtue emblem opens each main view; reading column stays quiet. */
:root{
  --bg:#f2f6fb; --bg2:#fbf3ef; --surface:#ffffff; --ink:#1d2f4a; --muted:#596b82; --line:#d9e3ee;
  --accent:#b07f22; --accent-soft:#f6ebd1; --deep:#2b6a9e; --mark:#fbe5a8;
  --sky1:#b9dcf3; --sky2:#e9f2fa; --dawn:#f6d3c4; --gold:#d2a64a; --rose:#e7a9a3; --green:#7fb88a; --lav:#c9c3ec; --rayink:#1d2f4a;
  --display:"Cormorant Garamond","Georgia",serif;
  --read:"Literata","Georgia",serif;
  --ui:"Manrope","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1828; --bg2:#1a1830; --surface:#14233a; --ink:#e8eef6; --muted:#9db0c6; --line:#24364f;
  --accent:#e3bf6b; --accent-soft:#3a3120; --deep:#9fcdf0; --mark:#5b4716;
  --sky1:#1c3a5e; --sky2:#13243c; --dawn:#4a2f45; --gold:#e3bf6b; --rose:#d68f8a; --green:#6fae7d; --lav:#9e97d6; --rayink:#0d1828; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1828; --bg2:#1a1830; --surface:#14233a; --ink:#e8eef6; --muted:#9db0c6; --line:#24364f;
  --accent:#e3bf6b; --accent-soft:#3a3120; --deep:#9fcdf0; --mark:#5b4716;
  --sky1:#1c3a5e; --sky2:#13243c; --dawn:#4a2f45; --gold:#e3bf6b; --rose:#d68f8a; --green:#6fae7d; --lav:#9e97d6; --rayink:#0d1828; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);background-image:linear-gradient(180deg,var(--bg) 0%,var(--bg) 55%,var(--bg2) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--deep)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid color-mix(in srgb,var(--gold) 45%,var(--line))}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;padding-block:10px}
.brand{font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:.01em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.backbtn{border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));background:var(--surface);color:var(--deep);font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;cursor:pointer}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13.5px;color:var(--muted);margin:0 0 14px}
.crumbs a{color:var(--deep);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:var(--gold)}
.crumbs [aria-current]{color:var(--ink);font-weight:600;max-width:40ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res a.sn{display:block;text-decoration:none;color:inherit;border-radius:8px;margin-inline:-8px;padding:4px 8px}
.res a.sn:hover{background:var(--accent-soft)}
.res a.sn .go{display:block;font-family:var(--ui);font-size:12.5px;font-weight:600;color:var(--deep);margin-top:4px;opacity:0;transition:opacity .15s}
.res a.sn:hover .go,.res a.sn:focus-visible .go{opacity:1}
@media (hover:none){.res a.sn .go{opacity:1}}
.text p.hit{background:color-mix(in srgb,var(--accent-soft) 70%,transparent);box-shadow:-14px 0 0 color-mix(in srgb,var(--accent-soft) 70%,transparent),14px 0 0 color-mix(in srgb,var(--accent-soft) 70%,transparent);border-radius:4px}
mark.cur{outline:2px solid var(--gold)}
.text p.hit{scroll-margin-top:110px}
.hitnav{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:999px;padding:5px 8px;box-shadow:0 4px 18px color-mix(in srgb,var(--deep) 18%,transparent);font-size:13px}
.hitnav button{border:0;background:var(--accent-soft);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer}
.hitnav span{min-width:4.5em;text-align:center;color:var(--muted)}
.backbtn:hover{border-color:var(--gold);color:var(--ink)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:6px 11px;border-radius:999px}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 50%,transparent)}
main{padding-block:22px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5.4vw,48px);line-height:1.05;letter-spacing:.005em}
h2{font-size:30px;line-height:1.15}
h3{font-size:22px;line-height:1.2}
.lede{color:var(--muted);max-width:62ch;margin:.6em 0 0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 6px}
.eyebrow a{color:inherit}
.num{font-variant-numeric:tabular-nums}
/* sky panel */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:30px clamp(18px,4vw,40px);margin-bottom:8px;
  background:
   radial-gradient(60% 50% at 82% 18%,color-mix(in srgb,#fff8e6 70%,transparent),transparent 70%),
   radial-gradient(45% 30% at 15% 100%,var(--dawn),transparent 70%),
   radial-gradient(40% 25% at 70% 105%,var(--dawn),transparent 70%),
   linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);
  border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line))}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:
   radial-gradient(18% 9% at 22% 22%,color-mix(in srgb,#fff 55%,transparent),transparent 70%),
   radial-gradient(22% 8% at 48% 12%,color-mix(in srgb,#fff 45%,transparent),transparent 70%);opacity:.8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:
   radial-gradient(60% 50% at 82% 18%,color-mix(in srgb,var(--gold) 18%,transparent),transparent 70%),
   radial-gradient(50% 35% at 20% 105%,var(--dawn),transparent 70%),
   linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%)}
 :root:not([data-theme="light"]) .hero::after{opacity:.08}}
:root[data-theme="dark"] .hero{background:
   radial-gradient(60% 50% at 82% 18%,color-mix(in srgb,var(--gold) 18%,transparent),transparent 70%),
   radial-gradient(50% 35% at 20% 105%,var(--dawn),transparent 70%),
   linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%)}
:root[data-theme="dark"] .hero::after{opacity:.08}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:center}
.hero-txt{min-width:0}
.hero-emb svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 22px color-mix(in srgb,var(--gold) 35%,transparent))}
.virtues{font-family:var(--display);font-size:19px;font-style:italic;color:var(--ink);opacity:.85;margin:.35em 0 0;letter-spacing:.02em}
.virtues b{font-weight:600;font-style:normal;color:var(--accent);margin:0 .25em}
.hero .lede{color:var(--ink);opacity:.8}
/* search */
.sbox{display:flex;gap:8px;margin-top:18px}
.sbox input{flex:1;min-width:0;padding:13px 16px;border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:999px;background:var(--surface);font-size:17px;box-shadow:0 2px 10px color-mix(in srgb,var(--deep) 10%,transparent)}
.btn{border:0;background:var(--ink);color:var(--bg);font-weight:700;padding:0 22px;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--deep)}
.btn.ghost{background:var(--surface);color:var(--deep);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));padding:7px 14px}
.btn.ghost:hover{border-color:var(--gold)}
.btn[disabled]{opacity:.45;cursor:default}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;align-items:center;color:var(--ink);opacity:.9;font-size:14px}
.filters select,.filters input{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters input{width:5.2em}
.hint{font-size:13px;color:var(--ink);opacity:.75;margin:10px 0 0}
.hint code{background:var(--surface);padding:1px 6px;border-radius:5px;font-family:var(--ui)}
.status{margin:22px 0 8px;color:var(--muted);font-size:14px}
.results{display:flex;flex-direction:column}
.res{padding:18px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:5.5em 1fr;gap:4px 14px}
.res .d{color:var(--accent);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:4px}
.res .b{min-width:0}
.res a.t{font-family:var(--display);font-size:23px;font-weight:600;color:var(--ink);text-decoration:none;line-height:1.2}
.res a.t:hover{color:var(--deep)}
.res .sn{font-family:var(--read);font-size:15px;color:var(--ink);opacity:.88;margin-top:6px}
.res .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);text-decoration:none;white-space:nowrap}
.chip:hover{border-color:var(--gold);color:var(--ink)}
.pager{display:flex;gap:8px;margin-top:18px;align-items:center}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.examples button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.examples button:hover{border-color:var(--gold)}
/* themes */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:22px}
.tcard{display:flex;flex-direction:column;gap:6px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);min-width:0;transition:border-color .2s,transform .2s}
.tcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.tcard h3{font-size:23px}
.tcard p{margin:0;color:var(--muted);font-size:13.5px}
.tcard .n{font-size:13px;color:var(--accent);font-weight:600}
.spark{display:block;width:100%;height:34px}
.spark rect{fill:var(--gold)}
.bigspark{height:90px;margin-top:16px}
.sparkw{position:relative}.axis{position:relative;height:16px;font-size:11px;color:var(--muted)}.axis span{position:absolute;transform:translateX(-50%);top:2px}
.quote{font-family:var(--read);font-size:16.5px;line-height:1.7;padding:20px 0 18px;border-top:1px solid var(--line);position:relative}
.quote::before{content:"✦";position:absolute;top:-10px;left:0;background:var(--bg);color:var(--gold);font-size:14px;padding-right:8px}
.quote p{margin:0 0 8px}
.quote .src{font-family:var(--ui);font-size:13px;color:var(--muted)}
details{border-top:1px solid var(--line);padding:11px 0}
summary{cursor:pointer;font-weight:600}
summary::marker{color:var(--gold)}
.list{list-style:none;padding:0;margin:8px 0 0;columns:2 300px;column-gap:28px}
.list li{break-inside:avoid;padding:3px 0;font-size:14px}
.list .d{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px;font-size:12.5px}
/* reader */
.reader{max-width:68ch;margin:0 auto}
.reader .head{margin-bottom:24px;text-align:center}
.reader .head .chips{justify-content:center}
.reader .info{color:var(--muted);font-size:14px;margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px}
.orn{display:flex;align-items:center;gap:12px;color:var(--gold);margin:18px auto 0;max-width:260px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.text{font-family:var(--read);font-size:18px;line-height:1.8}
.text p{margin:0 0 1em}
.rnav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.rnav a{text-decoration:none;max-width:48%}
.years{display:flex;flex-direction:column}
.loading{color:var(--muted);padding:20px 0}
.foot{color:var(--muted);font-size:13px;padding-block:26px 34px;text-align:center}
.foot .v{font-family:var(--display);font-size:18px;color:var(--accent);letter-spacing:.06em;margin-bottom:6px}
.bghero{margin-bottom:4px}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:18px}
.toc a{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink);font-weight:600}
.toc a:hover{border-color:var(--gold)}
.toc .num{color:var(--accent);font-family:var(--display);font-size:21px}
.bgsec{padding-top:36px;scroll-margin-top:80px}
.summary{color:var(--muted);max-width:62ch;margin:.5em 0 12px}
.summary span{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-right:8px}
.pagehead{padding:26px clamp(18px,4vw,36px)}
.pagehead .hero-in{grid-template-columns:minmax(0,1fr) 120px}
@media (max-width:640px){.hero-in{grid-template-columns:1fr}.hero-emb{order:-1;width:150px;margin:0 auto}.pagehead .hero-in{grid-template-columns:1fr}.pagehead .hero-emb{width:84px;margin:0}}
@media (max-width:560px){.res{grid-template-columns:1fr}.res .d{padding:0}.text{font-size:17px}.brand{font-size:21px}.sbox{flex-direction:column}.btn{padding:11px 22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#tarsene"><svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--gold)" stroke-width="1.6"/><polygon points="20,4.5 29.1,32.5 5.3,15.2 34.7,15.2 10.9,32.5" fill="none" stroke="var(--deep)" stroke-width="1.6" stroke-linejoin="round"/></svg>Беседите на Учителя</a>
  <button id="back" class="backbtn" type="button" hidden aria-label="Назад">← Назад</button>
  <nav id="nav"><a href="#tarsene" data-v="tarsene">Търсене</a><a href="#balgaria" data-v="balgaria">България</a><a href="#temi" data-v="temi">Теми</a><a href="#hronologia" data-v="hronologia">Хронология</a><a href="#stihove" data-v="stihove">Библейски стихове</a></nav>
</div></header>
<main class="wrap" id="app"><div class="loading">Зареждане на каталога…</div></main>
<div class="wrap foot"><div class="v">Любов · Мъдрост · Истина · Правда · Добродетел</div>3877 беседи на Петър Дънов (Беинса Дуно), 1895–1944. Текстовете са взети от beinsa.org; всяка беседа има връзка към оригинала.</div>

<script>
const $=s=>document.querySelector(s);
const app=$('#app');
let META=null, THEMES=null, VERSES=null, MAP=null, BG=null;
let HIST=[],cur=location.hash||'#tarsene',goingBack=false;
const cache=new Map();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(t){return t.toLowerCase().replace(/ё/g,'е').replace(/ѣ/g,'е').replace(/ѫ/g,'ъ').replace(/ѭ/g,'ю').replace(/і/g,'и').replace(/ъ(?![а-я])/g,'')}
async function getJSON(path){
  if(cache.has(path)) return cache.get(path);
  const p=(async()=>{
    const r=await fetch(path); if(!r.ok) throw new Error(path+' '+r.status);
    const buf=new Uint8Array(await r.arrayBuffer());
    let txt;
    if(buf[0]===0x1f&&buf[1]===0x8b){
      const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
      txt=await new Response(s).text();
    } else txt=new TextDecoder().decode(buf);
    return JSON.parse(txt);
  })();
  cache.set(path,p); p.catch(()=>cache.delete(path)); return p;
}
const shardOf=i=>getJSON('t/'+String(Math.floor(i/MAP.shard)).padStart(3,'0')+'.json');
async function docText(i){const s=await shardOf(i);return s[i%MAP.shard]}
const TH=()=>Object.fromEntries(THEMES.map(t=>[t.id,t]));
function fmtDate(d){const m=d.match(/^(\d{4})-(\d\d)-(\d\d)$/);if(!m)return d;return `${+m[3]}.${m[2]}.${m[1]}`}
function chips(ids){if(!THEMES||!ids.length)return '';const th=TH();return '<div class="chips">'+ids.map(id=>`<a class="chip" href="#tema-${id}">${esc(th[id].name)}</a>`).join('')+'</div>'}

/* ---------- emblem ---------- */
function pent(labels){
  const c=200,R=158,pt=k=>{const a=(-90+k*72)*Math.PI/180;return [c+R*Math.cos(a),c+R*Math.sin(a)]};
  const P=[0,1,2,3,4].map(pt);
  const rays=[[4,1,'Мъдрост','#e2bd62',50],[0,2,'Любов','#eaa9a2',80],[0,3,'Истина','#9fcbec',20],[1,3,'Правда','#8cc497',80],[2,4,'Добродетел','#c8c1ee',20]];
  const uid='p'+Math.random().toString(36).slice(2,7);
  let defs='',body='',txt='';
  rays.forEach(([a,b,w,col,off],k)=>{let [x1,y1]=P[a],[x2,y2]=P[b];if(x1>x2){[x1,x2]=[x2,x1];[y1,y2]=[y2,y1]}
    defs+=`<path id="${uid}${k}" d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
    body+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${labels?26:32}" stroke-opacity=".93"/>`;
    if(labels) txt+=`<text font-family="Manrope, Segoe UI, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#1d2f4a" dy="4.4"><textPath href="#${uid}${k}" startOffset="${off}%" text-anchor="middle">${w.toUpperCase()}</textPath></text>`;
  });
  const dots=Array.from({length:20},(_,k)=>{const a=k*18*Math.PI/180;return `<circle cx="${c+186*Math.cos(a)}" cy="${c+186*Math.sin(a)}" r="1.8" fill="var(--gold)"/>`}).join('');
  return `<svg viewBox="0 0 400 400" role="img" aria-label="Пентаграм с петте добродетели: Любов, Мъдрост, Истина, Правда, Добродетел"><defs>${defs}<radialGradient id="${uid}g" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#fff6dc" stop-opacity=".95"/><stop offset=".55" stop-color="var(--sky2)" stop-opacity=".7"/><stop offset="1" stop-color="var(--sky1)" stop-opacity=".9"/></radialGradient></defs>
  <circle cx="200" cy="200" r="194" fill="none" stroke="var(--gold)" stroke-width="2"/><circle cx="200" cy="200" r="178" fill="url(#${uid}g)" stroke="var(--sky1)" stroke-width="9"/><circle cx="200" cy="200" r="172" fill="none" stroke="var(--gold)" stroke-width="1.5"/>${dots}
  ${body}${txt}<circle cx="200" cy="205" r="13" fill="#fff6dc" stroke="var(--gold)" stroke-width="2"/></svg>`;
}
function pagehead(inner){return `<section class="hero pagehead"><div class="hero-in"><div class="hero-txt">${inner}</div><div class="hero-emb">${pent(false)}</div></div></section>`}
/* ---------- search ---------- */
function parseQuery(q){
  const phrases=[];q=q.replace(/"([^"]+)"|„([^“”"]+)[“”"]/g,(_,a,b)=>{phrases.push(a||b);return ' '});
  const terms=(norm(q).match(/[а-я]{2,}/g)||[]).map(stem);
  const ph=phrases.map(p=>(norm(p).match(/[а-я]+/g)||[]).map(stem)).filter(x=>x.length);
  return {terms,ph};
}

  const show=()=>{marks.forEach(m=>m.classList.remove('cur'));marks[k].classList.add('cur');lab.textContent=`${k+1} / ${marks.length}`};
  const go=d=>{k=(k+d+marks.length)%marks.length;show();marks[k].scrollIntoView({block:'center',behavior:'smooth'})};
  nav.children[0].onclick=()=>go(-1);nav.children[2].onclick=()=>go(1);show();
}
/* ---------- router ---------- */
async function route(){
  {const o=$('#hitnav'); if(o) o.remove();}
  const h=location.hash.slice(1)||'tarsene';
  const v=h.startsWith('bg-')?'balgaria':h.startsWith('tema-')?'temi':h.startsWith('b-')?'':h;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  if(h==='tarsene'){renderSearch();if(S.theme&&!S.res&&$('#th'))$('#th').value=S.theme;return}
  if(h==='balgaria'){if(!BG)BG=await getJSON('bulgaria.json');renderBulgaria();window.scrollTo(0,0);return}
  if(h.startsWith('bg-')){if(!BG)BG=await getJSON('bulgaria.json');renderBulgaria();const e=document.getElementById(h);if(e)e.scrollIntoView();return}
  if(h==='temi')return renderThemes();
  if(h.startsWith('tema-'))return renderTheme(h.slice(5));
  if(h==='hronologia')return renderChron();
  if(h==='stihove'){if(!VERSES)VERSES=await getJSON('verses.json');return renderVerses()}
  if(h.startsWith('b-')){const mm=h.match(/^b-(\d+)(?:-p(\d+))?$/);return renderReader(mm?+mm[1]:+h.slice(2),mm&&mm[2]!=null?+mm[2]:null)}
  renderSearch();
}
(async()=>{
  try{[META,MAP,THEMES]=await Promise.all([getJSON('meta.json'),getJSON('ix/map.json'),getJSON('themes.json')]);}
  catch(e){app.innerHTML='<p>Каталогът не можа да се зареди. Презаредете страницата.</p>';return}
  META.forEach((m,i)=>byNum.set(m[0],i));
  const SCROLL={};
  const bb=$('#back');
  window.addEventListener('hashchange',async()=>{
    SCROLL[cur]=window.scrollY;
    const back=goingBack;goingBack=false;
    if(!back&&location.hash!==cur)HIST.push(cur);
    cur=location.hash||'#tarsene';
    bb.hidden=!HIST.length;
    await route();
    const c=crumbs(); if(c) app.insertAdjacentHTML('afterbegin',c);
    if(back&&SCROLL[cur]!=null){const y=SCROLL[cur];setTimeout(()=>window.scrollTo(0,y),60)}
  });
  bb.onclick=()=>{if(!HIST.length){location.hash='tarsene';return}goingBack=true;location.hash=HIST.pop()};
  route().then(()=>{const c=crumbs();if(c)app.insertAdjacentHTML('afterbegin',c)});
})();
</script>
